<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Fondo oscuro redondeado para alto contraste en temas claros y oscuros del navegador -->
  <rect width="100" height="100" rx="22" fill="#09090b"/>

  <!-- Engranaje mecánico en blanco puro -->
  <g fill="#ffffff">
    <!-- Dientes perimetrales exteriores -->
    <rect x="44" y="8" width="12" height="10" rx="2.5" />
    <rect x="68" y="17" width="12" height="10" rx="2.5" transform="rotate(35 74 22)" />
    <rect x="73" y="66" width="12" height="10" rx="2.5" transform="rotate(-40 79 71)" />
    <rect x="44" y="82" width="12" height="10" rx="2.5" />
    <rect x="18" y="72" width="12" height="10" rx="2.5" transform="rotate(40 24 77)" />
    <rect x="8" y="44" width="10" height="12" rx="2.5" />
    <rect x="18" y="18" width="12" height="10" rx="2.5" transform="rotate(-40 24 23)" />

    <!-- Anillo semicircular del engranaje con apertura de corte a la derecha -->
    <path d="M 75 35 A 36 36 0 1 0 80 56 L 68 53 A 25 25 0 1 1 65 40 Z" />

    <!-- Soplete de corte / oxicorte en blanco -->
    <!-- Mango en diagonal -->
    <path d="M 22 67 L 31 58 C 32 57, 34 57, 35 58 L 38 61 C 39 62, 39 64, 38 65 L 29 74 C 28 75, 26 75, 25 74 Z" />
    <!-- Válvulas reguladoras -->
    <circle cx="31" cy="54" r="2.5" />
    <circle cx="36" cy="59" r="2.5" />
    <!-- Cañas gemelas del soplete -->
    <path d="M 33 56 L 52 37 L 55 40 L 36 59 Z" />
    <!-- Cabeza de corte acodada -->
    <path d="M 51 38 L 61 28 C 62 27, 64 27, 65 28 L 69 32 C 70 33, 70 35, 69 36 L 59 46 Z" />
    <!-- Boquilla de inyección -->
    <path d="M 63 26 L 72 21 L 74 24 L 66 29 Z" />
  </g>

  <!-- Flama y chispas de corte en ámbar luminoso (#f59e0b) para máxima distinción en pestaña -->
  <g fill="#f59e0b">
    <polygon points="75,22 81,14 78,21 86,18 79,24 87,26 79,27 84,34 78,29 76,36 75,28 69,31 73,25 66,23 73,23" />
    <circle cx="89" cy="19" r="2" />
    <circle cx="88" cy="31" r="2" />
    <circle cx="81" cy="11" r="2" />
    <circle cx="81" cy="39" r="1.8" />
  </g>
</svg>
